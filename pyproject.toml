[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fjordfish-tarea2"
version = "0.2.0"
description = "Notebook autocontenido de detección y cierre técnico de Tarea 2"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10", "PyYAML>=6", "pycocotools>=2.0.8", "matplotlib>=3.8"]

[project.optional-dependencies]
models = ["torch>=2.4", "torchvision>=0.19", "ultralytics==8.4.174"]
notebook = ["ipykernel>=6", "nbformat>=5", "nbclient>=0.10"]

[tool.setuptools]
py-modules = []
